name: Multi-asset investment research laboratory
on:
  workflow_dispatch:
  push:
    branches: ['feature/algotrading-backtest-v1']
    paths:
      - '.github/workflows/portfolio-strategies.yml'
      - 'algotrading/portfolio_lab.py'
      - 'algotrading/portfolio_experiments.py'
      - 'algotrading/requirements-market.txt'

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install historical market-data dependencies
        run: python -m pip install -r algotrading/requirements-market.txt
      - name: Run $50,000 sector, mean-reversion and multi-industry studies
        run: >
          python algotrading/portfolio_experiments.py
          --start 2018-01-01 --asof 2026-10-07
          --test-sessions 504 --rebalance 5
          --fee-bps 5 --slippage-bps 5
          --out output/portfolio_experiments
      - name: Summarize all portfolio experiment results
        if: always()
        run: |
          if [ -f output/portfolio_experiments/summary.json ]; then
            python -c "import json; j=json.load(open('output/portfolio_experiments/summary.json')); [print(g,k, 'NET',round(v['net_return_pct'],3),'SPY RISK MATCH',round(v['spy_risk_budget_return_pct'],3),'MAXDD',round(v['max_drawdown_pct'],3),'COST',round(v['estimated_transaction_cost_usd'],2),'ORDERS',v['order_events']) for g,variants in j['runs'].items() for k,v in variants.items()]"
          fi
      - name: Preserve exact input prices, signals, trade ledger and returns
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-asset-research-complete
          path: output/portfolio_experiments/
          retention-days: 30
          if-no-files-found: warn
