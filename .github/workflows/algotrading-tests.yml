name: Algo-trading research tests
on:
  push:
    branches: ['feature/algotrading-backtest-v1']
    paths:
      - 'algotrading/**'
      - '.github/workflows/algotrading-tests.yml'
  pull_request:
    paths:
      - 'algotrading/**'
      - '.github/workflows/algotrading-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install -r algotrading/requirements.txt
      - name: Unit tests (synthetic fixtures; no market data or broker)
        run: python -m pytest -q algotrading
